apiVersion: v1
kind: Namespace
metadata:
  name: activity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: activity
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: activity
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: activity
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: activity
spec:
  selector: { app: kafka }
  ports:
    - port: 9092
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: activity
spec:
  replicas: 2
  selector:
    matchLabels: { app: activity-service }
  template:
    metadata:
      labels: { app: activity-service }
    spec:
      containers:
        - name: app
          image: activity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - { name: PORT, value: "3000" }
            - { name: MONGO_URI, value: "mongodb://mongo:27017/activity" }
            - { name: KAFKA_BROKER, value: "kafka:9092" }
            - { name: KAFKA_TOPIC, value: "user-activity" }
            - { name: KAFKAJS_NO_PARTITIONER_WARNING, value: "1" }
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: activity
spec:
  type: NodePort
  selector: { app: activity-service }
  ports:
    - port: 3000
      targetPort: 3000